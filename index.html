<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hayat-us-Sahaba Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap">
<style>
/* Layout: QuranWBW-style. Patterned paper ground, solid cards for reading, green banner. Spacing steps: 4 8 12 16 24 32. */
:root{--bg:#fffefb;--card:#fffdf8;--surface:#f6f0df;--surface-2:#eee4c8;--ink:#17211d;--mute:#6b6f66;--line:#e8dfc4;--gold:#8f6d15;--gold-soft:#c9a64c;--teal:#0b5a43;--on-teal:#fff;--scene:#0b4d3a;--scene-in:#0f6049;
--hero-a:#0e6047;--hero-b:#073a2b;--hero-ink:#f7efd8;--hero-gold:#ecd08a;--hl-y:#ffe88a;--hl-g:#bfeccb;--hl-b:#c3dfff;--hl-p:#ffcfe0;--quote:#edf5ee;--shadow:0 12px 36px #3a2e0a2e;--lift:0 1px 2px #5a460f14,0 6px 18px #5a460f0f;
--ui:Inter,system-ui,"Segoe UI",sans-serif;--ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;--ar:"Scheherazade New","Amiri","Traditional Arabic",serif;--size:19px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1310;--card:#151e19;--surface:#1b261f;--surface-2:#25342b;--ink:#ebe7da;--mute:#9ba79f;--line:#2a3a31;--gold:#d9b85f;--gold-soft:#b89747;--teal:#74cdab;--on-teal:#062a1f;--scene:#0a3427;--scene-in:#0e4634;--hero-a:#0f4534;--hero-b:#082a20;--hl-y:#6b5a12;--hl-g:#1f5a38;--hl-b:#1f4673;--hl-p:#6e2c48;--quote:#12261d;--shadow:0 12px 36px #000a;--lift:0 1px 2px #0006,0 6px 18px #0004;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1310;--card:#151e19;--surface:#1b261f;--surface-2:#25342b;--ink:#ebe7da;--mute:#9ba79f;--line:#2a3a31;--gold:#d9b85f;--gold-soft:#b89747;--teal:#74cdab;--on-teal:#062a1f;--scene:#0a3427;--scene-in:#0e4634;--hero-a:#0f4534;--hero-b:#082a20;--hl-y:#6b5a12;--hl-g:#1f5a38;--hl-b:#1f4673;--hl-p:#6e2c48;--quote:#12261d;--shadow:0 12px 36px #000a;--lift:0 1px 2px #0006,0 6px 18px #0004;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ur{font-family:var(--ur);direction:rtl;line-height:2.2}
.sw{font-family:var(--ar);font-size:.92em;font-weight:400;line-height:1;margin:0 .1em;white-space:nowrap}
svg.ic{width:20px;height:20px;flex:none}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
/* top bars */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 12px #5a460f0d}
.top .wrap{display:flex;align-items:center;gap:6px;min-height:60px}
.nbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;font-weight:500;white-space:nowrap}
.nbtn svg{color:var(--gold)}
.nbtn:hover,.nbtn.on{background:var(--surface)}
.me{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 5px;border-radius:24px;border:1px solid var(--line);font-weight:600;white-space:nowrap;max-width:170px}
.me span{overflow:hidden;text-overflow:ellipsis}
.me.plain{padding:0 14px}
.avatar{flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:56px;height:56px;font-size:22px}
.title-btn{flex:1;min-width:0;display:flex;justify-content:center;align-items:center;gap:10px;min-height:44px;padding:0 8px;border-radius:12px}
.title-btn:hover{background:var(--surface)}
.title-btn .ur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:700;min-width:0}
.sub .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:38px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.sub .ur{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.line{height:4px;background:var(--surface-2)}
.line i{display:block;height:100%;background:var(--gold-soft);transition:width .3s}
.bar{display:block;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-soft);border-radius:6px;transition:width .3s}
.bar.full i,.line.full i{background:var(--teal)}
main{padding-block:24px 56px;min-height:60vh}
/* buttons and controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border-radius:24px;padding:0 18px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.btn:hover{border-color:var(--gold-soft)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.small{min-height:34px;padding:0 14px;font-size:12.5px}
.btn.ghost{background:var(--card)}
.btn svg.ic{width:17px;height:17px}
.field{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 18px;min-width:0;box-shadow:var(--lift)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:4px;gap:4px;max-width:100%}
.seg button{padding:8px 18px;border-radius:22px;font-weight:600;font-size:13px}
.seg button.on{background:var(--teal);color:var(--on-teal)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:34px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--mute)}
.chips button.on{background:var(--surface-2);border-color:var(--gold-soft);color:var(--ink)}
/* home */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;border-radius:22px;padding:30px 34px;color:var(--hero-ink);background:var(--hero-b);border:1px solid var(--gold-soft);box-shadow:inset 0 0 0 5px #0000002e,inset 0 0 0 6px #ecd08a55,var(--lift)}
.hero .name{font-family:var(--ur);font-size:36px;color:var(--hero-gold);line-height:2.2;direction:rtl;font-weight:700;white-space:nowrap}
.hero h1{margin:0 0 8px;font-size:21px;color:var(--hero-gold);text-wrap:balance}
.hero p{margin:0;opacity:.88;max-width:48ch;line-height:1.65}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--hero-gold) calc(var(--p)*1%),#ffffff24 0);display:grid;place-items:center}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--hero-b);display:grid;place-items:center;text-align:center;font-weight:700;font-size:19px;line-height:1.25}
.ring small{display:block;font-weight:400;font-size:11px;opacity:.8;margin-top:2px}
.continue{margin-top:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--lift)}
.continue .ur{flex:1;min-width:180px;font-size:15.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:16px;padding:4px 18px 16px;box-shadow:var(--lift)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs button{padding:13px 14px 11px;font-weight:600;font-size:13px;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold-soft)}
.empty{color:var(--mute);padding:4px 2px;margin:0}
.browse-head{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:32px 0 16px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#filter{margin-bottom:16px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px;direction:ltr}
.chcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--lift);transition:transform .18s,border-color .18s}
.chcard:hover{border-color:var(--gold-soft);transform:translateY(-2px)}
.scene{display:block;width:100%;height:auto;aspect-ratio:160/96}
.chbody{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.chbody .ur{font-size:17px;font-weight:700;text-align:right}
.chbody>a.row{flex:1;align-items:center}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute);line-height:1.5}
.chfoot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:10px 12px}
.rosette{flex:none;width:40px;height:40px;display:grid;place-items:center;font:700 12px var(--ui);color:var(--gold);position:relative;z-index:0}
.rosette::before,.rosette::after{content:"";position:absolute;inset:6px;background:var(--surface-2);border-radius:5px;z-index:-1}
.rosette::after{transform:rotate(45deg)}
.tcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;transition:border-color .18s}
.tcard:hover{border-color:var(--gold-soft);background:var(--surface)}
.tcard .mid{min-width:0;direction:rtl;text-align:right;display:flex;flex-direction:column;gap:8px}
.tcard .ur{display:block;font-size:14px;line-height:2.15}
.tcard .meta{direction:ltr;justify-content:flex-end}
.tcard .art{width:48px;height:48px;border-radius:14px;background:var(--surface);color:var(--gold);display:grid;place-items:center}
.tcard .art svg{width:30px;height:30px}
.tcard.done{background:var(--quote)}
.tcard .bar{height:4px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.acc>button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;padding:14px 18px;text-align:left}
.acc>button:hover{background:var(--surface)}
.acc .mid{display:flex;flex-direction:column;gap:8px;min-width:0}
.acc .mid>.ur{display:block;font-size:16.5px;font-weight:700;text-align:right}
.acc .mid>.meta{direction:ltr}
.acc .chev{transition:transform .2s;color:var(--gold)}
.acc.open .chev{transform:rotate(180deg)}
.acc.open>button{border-bottom:1px solid var(--line);background:var(--surface)}
.acc .inner{padding:14px}
/* reader */
.chapter-head{border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);margin-bottom:20px}
.chapter-head .scene{height:180px;aspect-ratio:auto;background:var(--scene)}
.chapter-head .txt{padding:14px 32px 22px;text-align:center}
.chapter-head h1{font-size:23px;margin:0 0 10px;color:var(--teal);text-wrap:balance}
.intro{font-size:calc(var(--size) - 2px);text-align:justify;text-align-last:center;color:var(--mute)}
.topic-head{text-align:center;padding:8px 16px 22px}
.topic-head .art{display:inline-grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--card);border:1px solid var(--gold-soft);box-shadow:0 0 0 5px var(--surface);color:var(--gold)}
.topic-head .art svg{width:40px;height:40px}
.topic-head h1{font-size:23px;margin:12px 0 4px;color:var(--teal);text-wrap:balance}
.story{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--lift);padding:16px 30px 18px;margin-bottom:18px;scroll-margin-top:112px}
.story.read{border-color:var(--teal)}
.story.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 4px var(--gold-soft)}100%{box-shadow:var(--lift)}}
.acts{display:flex;align-items:center;gap:6px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--gold)}
.story.read .chip{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.badge{display:none;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--teal);margin-right:6px}
.badge svg.ic{width:16px;height:16px}
.story.read .badge{display:inline-flex}
.act{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:12px;color:var(--gold);font-size:12.5px;font-weight:600}
.act:hover{background:var(--surface)}
.act.on svg.fillable{fill:currentColor}
.text{direction:rtl;font-family:var(--ur);font-size:var(--size);line-height:2.4;text-align:right;-webkit-tap-highlight-color:transparent}
.text p{margin:0 0 12px;text-align:justify}
.text p:last-child{margin-bottom:0}
.text p.q{font-family:var(--ar);font-size:calc(var(--size) + 6px);line-height:2.15;text-align:center;background:var(--quote);border:1px solid var(--line);border-radius:14px;padding:12px 20px;margin:16px 0;color:var(--teal)}
.text p.c{background:var(--surface);border-right:3px solid var(--gold-soft);padding:10px 20px;border-radius:12px;margin:16px 0}
.lbl{color:var(--gold);font-weight:700;user-select:none;margin-left:.4em}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--surface-2)}
.w .b{font-weight:700;color:var(--teal)}
.text p:not(.q) .a{font-family:var(--ar)}
.hy{background:var(--hl-y)!important}.hg{background:var(--hl-g)!important}.hb{background:var(--hl-b)!important}.hp{background:var(--hl-p)!important}
.w.noted{text-decoration:underline dotted var(--gold) 2px;text-underline-offset:9px}
.w.pick,.g.pick{box-shadow:inset 0 -3px 0 var(--gold-soft)}
sup{font:700 10px var(--ui);color:var(--gold);user-select:none}
.notes-in{display:grid;gap:8px}
.notes-in:not(:empty){margin-top:14px}
.notecard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:4px;text-align:left;width:100%}
.notecard .ur{font-size:13px;color:var(--mute)}
.notecard .body{white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext}
.fns{direction:ltr;text-align:left;font-size:11.5px;line-height:1.65;color:var(--mute);margin-top:16px;background:var(--surface);border-radius:10px;padding:10px 14px}
.fns div+div{margin-top:4px}
.fns b{color:var(--gold)}
body.nofn .fns,body.nofn sup{display:none}
.endrow{display:flex;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.done-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 20px;border-radius:24px;border:1px solid var(--teal);color:var(--teal);font-weight:600;font-size:13px}
.done-btn:hover{background:var(--quote)}
.done-btn.on{background:var(--teal);color:var(--on-teal)}
.nextbox{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
/* floating bar, popover, sheets */
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--card);border:1px solid var(--gold-soft);box-shadow:var(--shadow);border-radius:40px;display:flex;gap:4px;padding:7px;width:min(320px,calc(100% - 24px));justify-content:space-between}
.pill button,.pill a{width:56px;height:44px;border-radius:24px;display:grid;place-items:center;color:var(--gold)}
.pill button:hover,.pill a:hover,.pill .on{background:var(--surface-2)}
.pill .off{opacity:.3;pointer-events:none}
.pill svg.ic{width:22px;height:22px}
.marker-dot{position:relative}
.marker-dot.on::after{content:"";position:absolute;right:10px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--dot);border:1px solid var(--ink)}
.pop{position:absolute;z-index:40;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:14px;width:280px;display:grid;gap:10px}
.pop .seg{display:flex}.pop .seg button{flex:1;padding:6px}
.dots{display:flex;gap:12px;align-items:center;justify-content:center}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.dot.sel{border-color:var(--ink)}
.veil{position:fixed;inset:0;background:#06140e99;z-index:50;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--card);width:min(600px,100%);max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:0 max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start;box-shadow:var(--shadow)}
@media(min-width:700px){.veil{align-items:center}.sheet{border-radius:22px;max-height:86%}}
.sheet header{position:sticky;top:0;z-index:2;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line)}
.sheet h2{margin:0;font-size:17px}
.sheet textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;resize:vertical;unicode-bidi:plaintext}
.quote{background:var(--surface);border-radius:12px;padding:8px 14px;font-size:14px;max-height:130px;overflow:auto}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.authform{display:flex;flex-direction:column;gap:12px}
.authfield{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px}
.authfield .field{width:100%;font-size:16px;font-weight:400}
.autherror{margin:0;color:#b3261e;font-size:13px;font-weight:600}.autherror:empty{display:none}
:root[data-theme="dark"] .autherror{color:#ffb4ab}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .autherror{color:#ffb4ab}}
.reccode{font:700 20px/1.6 ui-monospace,Consolas,monospace;letter-spacing:.04em;text-align:center;padding:16px 10px;border:2px dashed var(--gold);border-radius:14px;overflow-wrap:anywhere;user-select:all}
.note-text{margin:0;color:var(--mute);font-size:12.5px;line-height:1.65}
.profile{display:flex;gap:14px;align-items:center}
.profile b{display:block;font-size:16px}
.profile>div{min-width:0;overflow-wrap:anywhere}
.profile small{color:var(--mute);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center;font-size:11.5px;color:var(--mute)}
.stats strong{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;z-index:60;font-size:13px;width:max-content;max-width:calc(100% - 32px)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.item .go{min-width:0;text-align:right;direction:rtl}
.item .go .ur{font-size:14px}.item .go small{display:block;direction:ltr;text-align:right;font:11.5px/1.7 var(--ui);color:var(--mute)}
.item .go small .sw{font-family:var(--ar)}
.item .body{white-space:pre-wrap;unicode-bidi:plaintext;overflow-wrap:anywhere;direction:ltr;text-align:left;font-size:13.5px;grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px}
#view h3{margin:24px 0 12px;font-size:14px}
mark{background:var(--hl-y);color:inherit}
@media(max-width:700px){
 .nbtn span{display:none}.nbtn{padding:0 9px}
 .me span:not(.avatar){display:none}.me{padding:0 4px}.me.plain{padding:0 10px}.me.plain span{display:inline}
}
@media(max-width:640px){
